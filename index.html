<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) meaningful; without it
         the insets evaluate to 0 and safe-area CSS is silently inert. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E8B57" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mamori" />
    <title>Mamori</title>
    <style>
      /* Pressed feedback for primary touch surfaces. Inline styles can't
         express :active, and this keeps it to one rule instead of pointer
         state in every component. */
      .tap { -webkit-tap-highlight-color: transparent; transition: opacity 120ms ease, transform 120ms ease; }
      .tap:active { opacity: 0.72; transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
