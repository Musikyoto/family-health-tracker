# Supabase keep-alive — free-tier projects pause after ~7 idle days. This
# pings the dedicated no-op RPC (migration 013) daily so the project stays
# active; GitHub emails the repo owner when a scheduled run fails.
#
# NOTE: GitHub disables cron schedules after 60 days without repo activity
# (warning email first; re-enable in the Actions tab). The durable
# alternative is Supabase Pro.
name: keepalive

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST daily
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ts=$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase is awake — server time: $ts"
